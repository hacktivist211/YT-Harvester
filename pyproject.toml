[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytharvest"
version = "2.0.0"
description = "Anti-detection, transactional YouTube harvester built on yt-dlp + FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YT-Harvester contributors" }]
dependencies = [
    "yt-dlp>=2024.4.9",
    "mutagen>=1.47",
    "cryptography>=42",
    "curl_cffi>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytharvest = "ytharvest.cli:main"

[tool.setuptools.packages.find]
include = ["ytharvest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that hit the network",
]
